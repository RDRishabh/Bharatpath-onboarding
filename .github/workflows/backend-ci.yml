# Backend CI.
#
# Path-filtered so the frontend work happening in parallel in this same repo
# does not trigger backend runs, and vice versa. Add a sibling frontend-ci.yml
# with its own paths filter rather than extending this one.

name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Invariants 5 and 6 are pure static checks with no dependencies, so they run
  # first and fail fast. They are legal requirements, not style preferences.
  invariants:
    name: invariants 5 and 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Invariant 5 - no age-gating
        run: python scripts/check_no_age_fields.py
      - name: Invariant 6 - no financial framing
        run: python scripts/check_vocabulary.py

  lint:
    name: lint, types, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check app tests scripts
      - name: ruff format
        run: ruff format --check app tests scripts
      - name: mypy
        run: mypy app
      - name: module boundaries (import-linter)
        # Enforces invariant 4-prime: add-on modules can never import scoring.
        run: lint-imports
      - name: every module skeleton present
        run: python scripts/gen_modules.py --check

  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bharatpath
          POSTGRES_PASSWORD: bharatpath
          POSTGRES_DB: bharatpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bharatpath"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bharatpath:bharatpath@localhost:5432/bharatpath
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

  openapi:
    name: publish openapi.json
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: export schema
        # The mobile and three web teams generate their clients from this.
        # Publishing it from Day 2 with stub endpoints is what stops four
        # client teams being blocked on the backend.
        env:
          DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/db
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/export_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

  image:
    name: build image
    runs-on: ubuntu-latest
    needs: [invariants, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: bharatpath-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
